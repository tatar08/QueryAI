[package]
name = "tabularis-web-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
rand = "0.8.8"
ring = "0.17"
argon2 = "0.5"
chrono = "0.4"
futures-util = "0.3"
openidconnect = "4.0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sqlparser = { version = "0.62", features = ["visitor"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tabularis-core = { path = "../src-core" }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
